name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # The browser is a 100 MB download and the same build until the lockfile moves.
      # Keep it between runs; the first run after a dependency change still installs it.
      - name: Cache Playwright's browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json', 'mcp/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e

      # The report and the evidence are kept on every run, as GitLab's artifacts
      # are: the HTML report is there even when the suite passed, and the videos,
      # screenshots and traces appear in it exactly when a check fails (the config
      # keeps them only on failure). The retention cap keeps a long-lived branch
      # from piling runs up.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The MCP server is a second artefact in this repository, so it is built and
  # tested like one. Its integration check serves the app's own build, so the app is
  # built first, and it opens a browser — the same Chromium the end-to-end suite uses.
  mcp:
    name: MCP server
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Cache Playwright's browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json', 'mcp/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm --prefix mcp ci
      - run: npm --prefix mcp run build
      - run: npm --prefix mcp test
