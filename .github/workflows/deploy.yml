name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # the version bump and its tag are committed back to main
  pages: write
  id-token: write   # the Pages deployment, and npm's trusted publishing when it is set up

concurrency:
  group: pages
  # A release is a version, and a version is a fact: cancelling a run in flight drops
  # one silently, which is exactly what happened to v1.0.94 — its publish was cancelled
  # when the next merge arrived, and npm went from 1.0.93 to 1.0.95 with nothing said.
  # Runs queue instead. That is also why each publish job takes the commit *its own run*
  # stamped rather than whatever `main` says by the time it starts: two merges in quick
  # succession are two runs, and each must publish the version it made.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    outputs:
      version: ${{ steps.version.outputs.version }}
      # The bump commit this run pushed. The publish job checks this out rather than
      # `main`, so a queued run publishes the release it made and not a later one.
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Every merge to main is a new version: the patch is bumped, the bump is
      # pushed back and tagged `vX.Y.Z`, and the build below bakes that number
      # into the app — so the tag, main's package.json and the number beside the
      # logo all agree. A push made with GITHUB_TOKEN does not start another run,
      # and `[skip ci]` says so as well. Bump the minor or major by hand before
      # merging when a release deserves it: see docs/VERSIONING.md.
      #
      # The MCP server carries the same number, because a clip's written shape is a
      # contract between the two: CI owns it, and stamps both in this one commit so
      # they cannot drift.
      - name: Bump the version and tag it
        id: version
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          npm --prefix mcp run sync-version
          npm --prefix mcp install --package-lock-only --no-audit --no-fund
          git add package.json package-lock.json mcp/package.json mcp/package-lock.json
          git commit -m "chore: bump version to v$VERSION [skip ci]"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Report the deployed version
        run: echo "Deployed DemoClip v${{ needs.build.outputs.version }} — ${{ steps.deployment.outputs.page_url }}"

  # Publishing the server is its own job, and it waits on the build rather than living
  # inside it. A release that cannot publish must not take the site down with it: a
  # failing publish in the build job skipped the Pages deploy twice, and the site sat a
  # version behind while nothing said so. Here, the site ships either way and the
  # publish fails on its own, in its own job, where it can be read.
  publish-mcp:
    name: Publish the MCP server
    needs: build
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      # This run's own release, not whatever `main` says by the time this job starts:
      # two merges close together are two queued runs, and each publishes the version it
      # stamped. Publishing `main` would have both of them publish the newer version, and
      # the second would fail on a version that already exists.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # What lets `npm publish` in mcp/ authenticate, until a trusted publisher is
          # configured for the package and the token can be retired.
          registry-url: https://registry.npmjs.org

      # Trusted publishing is npm's own recommendation for CI: short-lived credentials
      # minted from this workflow's identity, no token to rotate or leak, and provenance
      # attestations for free. It needs npm 11.5.1 or later, which Node 22 does not
      # carry. With a trusted publisher configured for the package the CLI finds the
      # OIDC identity by itself, and where a token is present too it prefers the OIDC
      # one — so this step is the same either way.
      - name: The npm CLI that trusted publishing needs
        run: npm install -g npm@^11.5.1 && npm --version

      - run: npm ci
      - run: npm run build

      # The server ships the app's own build inside it, which is what makes "the two
      # agree on how a clip is written down" true by construction rather than a
      # promise. Playwright's browser download is skipped: a release compiles and
      # packs, and a browser is the person's own install to fetch.
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm --prefix mcp ci
      - run: npm --prefix mcp run bundle-app
      - run: npm --prefix mcp run build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # A token is one way to authenticate and a trusted publisher is the other,
          # which npm prefers when it is there. Skip only when neither exists: with
          # OIDC configured this step keeps working after the token is retired.
          if [ -z "$NODE_AUTH_TOKEN" ] && [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "Neither NPM_TOKEN nor a trusted publisher (OIDC) is available — the version was stamped, but nothing was published."
            exit 0
          fi
          cd mcp && npm publish --access public
